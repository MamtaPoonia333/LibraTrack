services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: library
      MYSQL_PASSWORD: library
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    container_name: library-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/library_management?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      LIBRARY_DATA_DIRECTORY: /data
      LIBRARY_JWT_SECRET: replace-with-a-long-random-secret
      LIBRARY_OTP_SECONDS: "600"
      LIBRARY_EXPOSE_OTP: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
      REDIS_TIMEOUT: "2000ms"
      MAIL_HOST: ""
      MAIL_PORT: "587"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
    volumes:
      - backend-data:/data

volumes:
  mysql-data:
  redis-data:
  backend-data:
