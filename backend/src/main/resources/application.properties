server.port=8080
spring.application.name=library-management
library.cors-origins=${LIBRARY_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
library.data-directory=${LIBRARY_DATA_DIRECTORY:data}
library.fine-per-day=${LIBRARY_FINE_PER_DAY:1.0}
library.jwt-secret=${LIBRARY_JWT_SECRET:change-this-development-secret-change-this}
library.jwt-access-seconds=${LIBRARY_JWT_ACCESS_SECONDS:900}
library.jwt-refresh-seconds=${LIBRARY_JWT_REFRESH_SECONDS:604800}
library.otp-seconds=${LIBRARY_OTP_SECONDS:600}
library.expose-otp=${LIBRARY_EXPOSE_OTP:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
